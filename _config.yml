title: "Hemershon Silva"
description: "Engenheiro de Software Sênior: Ruby on Rails, arquitetura backend, cloud e plataformas SaaS escaláveis."
url: "https://hemershon.github.io"
baseurl: ""

lang: "pt-BR"
timezone: "America/Fortaleza"
markdown: kramdown
highlighter: rouge
permalink: pretty

author:
  name: "Hemershon Silva"
  email: ""
  bio:
    pt: "Engenheiro de Software Sênior com mais de 14 anos de experiência, especializado em Ruby on Rails e arquitetura backend."
    en: "Senior Software Engineer with 14+ years of experience, specialized in Ruby on Rails and backend architecture."

languages:
  - code: pt
    label: Português
    html_lang: pt-BR
  - code: en
    label: English
    html_lang: en

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      lang: pt
  - scope:
      path: ""
    values:
      layout: page
      lang: pt

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

feed:
  path: /feed.xml

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - vendor
  - node_modules
  - scripts
  - "*.gem"
  - "*.gemspec"
