pt:
  intro: "Olá, eu sou Hemershon."
  bio: "Engenheiro de Software Sênior com mais de 14 anos de experiência no desenvolvimento de soluções web, sendo mais de 10 anos especializados em Ruby on Rails e arquitetura backend."
  summary:
    - "Ao longo da minha trajetória, atuei em projetos de diferentes segmentos, incluindo telecomunicações, financeiro, educação e sistemas de gestão administrativa, desenvolvendo aplicações escaláveis, APIs robustas e plataformas de alta disponibilidade."
    - "Minha atuação é fortemente focada na construção de arquiteturas limpas, sustentáveis e orientadas à performance, sempre priorizando qualidade de código, escalabilidade, observabilidade e manutenção a longo prazo."
    - "Possuo experiência no desenvolvimento de sistemas SaaS, integrações complexas, microsserviços, infraestrutura cloud e pipelines de CI/CD, trabalhando diretamente com ambientes de produção e aplicações de missão crítica."
    - "Tenho perfil analítico e forte capacidade de resolução de problemas complexos, buscando sempre criar soluções eficientes, seguras e escaláveis alinhadas às necessidades do negócio."
    - "Atualmente busco desafios em engenharia backend, arquitetura de software, cloud computing e plataformas escaláveis."
  skill_groups:
    - name: "Backend"
      items: ["Ruby on Rails", "PHP (Laravel)", "Golang", "Elixir", "Python"]
    - name: "Frontend"
      items: ["Vue.js", "React.js", "JavaScript", "TypeScript"]
    - name: "Cloud & DevOps"
      items: ["AWS", "Docker", "Kubernetes", "Terraform", "Heroku", "DigitalOcean"]
    - name: "CI/CD"
      items: ["GitLab CI/CD", "GitHub Actions"]
    - name: "Observabilidade"
      items: ["NewRelic", "Datadog", "Dynatrace"]
    - name: "Bancos de Dados"
      items: ["PostgreSQL", "MySQL", "MariaDB", "Redis"]
    - name: "Arquitetura"
      items: ["APIs REST", "Microsserviços", "Sistemas SaaS", "Arquitetura Escalável"]
  interests: ["Engenharia Backend", "Arquitetura de Software", "Cloud Computing", "Plataformas Escaláveis"]
  education:
    - course: "Engenharia de Software"
      institution: "Estácio"
      period: "jan. 2019 – dez. 2022"
      description:
        - "Formação que equilibrou teoria e prática, com foco nos princípios fundamentais do desenvolvimento de software: design, análise e implementação eficiente de sistemas."
        - "Participei ativamente de projetos práticos, do desenvolvimento de aplicativos à gestão do ciclo de vida de software, aprimorando metodologias ágeis, boas práticas de codificação e testes, sempre trabalhando em equipe para resolver desafios reais."
      activities: "Atividades extracurriculares, hackathons e projetos colaborativos."
    - course: "Bacharelado em Ciência da Computação"
      institution: "Estácio"
      period: "jul. 2017 – nov. 2021"
      description:
        - "Formação sólida em fundamentos teóricos e práticos da computação: programação, algoritmos, estruturas de dados, engenharia de software, banco de dados, sistemas operacionais, redes, inteligência artificial e arquitetura de computadores."
        - "Desenvolvimento de raciocínio lógico, pensamento computacional e resolução de problemas complexos, com estudos em DevOps, computação em nuvem e tecnologias emergentes."
      activities: "Comunidades acadêmicas, grupos de tecnologia, eventos acadêmicos, hackathons e iniciativas Open Source."
  social_links:
    - name: "GitHub"
      url: "https://github.com/hemershon"
    - name: "LinkedIn"
      url: "https://www.linkedin.com/in/hemershon-silva/"
    - name: "Email"
      url: "mailto:hemershon@gmail.com"

en:
  intro: "Hello, I'm Hemershon."
  bio: "Senior Software Engineer with over 14 years of experience building web solutions, including more than 10 years specializing in Ruby on Rails and backend architecture."
  summary:
